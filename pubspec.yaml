name: jitendra_transport
version: 1.0.0+1
description: Offline transport management for Jitendra Transport Company.
publish_to: none
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  share_plus: ^10.1.4
  intl: ^0.19.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: '#0C3169'
  adaptive_icon_foreground: assets/app_icon.png
