name: Build Android Test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml && -f lib/main.dart ]]; then
            PROJECT_DIR='.'
          else
            mapfile -t matches < <(find . -mindepth 2 -maxdepth 4 -name pubspec.yaml -not -path '*/build/*' -not -path '*/.dart_tool/*' | sort)
            if [[ ${#matches[@]} -ne 1 ]]; then
              printf 'Expected exactly one Flutter project; found %s\n' "${#matches[@]}"
              printf '%s\n' "${matches[@]}"
              exit 1
            fi
            PROJECT_DIR="$(dirname "${matches[0]}")"
            test -f "$PROJECT_DIR/lib/main.dart"
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - name: Generate Android platform
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter create --platforms=android --project-name=jitendra_transport .
      - name: Install application and development dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter pub add --dev flutter_test --sdk=flutter
          flutter pub add --dev flutter_lints
          flutter pub get
      - name: Remove incompatible generated template test
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - name: Analyze application
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter analyze --no-fatal-infos
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jitendra-Transport-Test-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
